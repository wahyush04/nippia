services:
  nippia-db:
    image: postgres:16-alpine
    container_name: nippia-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nippia}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nippia_secret}
      POSTGRES_DB: ${POSTGRES_DB:-nippia_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - nippia_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nippia} -d ${POSTGRES_DB:-nippia_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - nippia-network

  nippia-redis:
    image: redis:7-alpine
    container_name: nippia-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - nippia_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - nippia-network

volumes:
  nippia_pgdata:
  nippia_redisdata:

networks:
  nippia-network:
    driver: bridge
