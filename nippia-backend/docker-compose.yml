services:
  nippia-db:
    image: postgres:16-alpine
    container_name: nippia-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nippia}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nippia_secret}
      POSTGRES_DB: ${POSTGRES_DB:-nippia_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - nippia_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nippia} -d ${POSTGRES_DB:-nippia_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - nippia-network

  nippia-redis:
    image: redis:7-alpine
    container_name: nippia-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - nippia_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - nippia-network

  nippia-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nippia-api
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-nippia}:${POSTGRES_PASSWORD:-nippia_secret}@nippia-db:5432/${POSTGRES_DB:-nippia_db}
      REDIS_URL: redis://nippia-redis:6379
    ports:
      - "${PORT:-3000}:3000"
    depends_on:
      nippia-db:
        condition: service_healthy
      nippia-redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - nippia-network

volumes:
  nippia_pgdata:
  nippia_redisdata:

networks:
  nippia-network:
    driver: bridge
