openapi: 3.0.3
info:
  title: Nippia REST API
  version: 1.0.0
  description: |
    Spesifikasi OpenAPI (Swagger) untuk backend Nippia – Latihan Soal CPNS & CAT.
    Sumber kontrak utama: `docs/API_CONTRACT.md`.

servers:
  - url: http://localhost:3000/api/v1
    description: Local Development
  - url: https://api.nippia.kulitech.my.id/api/v1
    description: Production

tags:
  - name: Health
    description: Pemeriksaan kesehatan layanan (Database & Redis)
  - name: Auth
    description: Autentikasi Google Sign-In, Guest Mode, Account Linking, dan Token Refresh
  - name: Users
    description: Profil pengguna dan pengaturan onboarding
  - name: Onboarding
    description: Katalog formasi CPNS dan soal Diagnostic Baseline Quiz
  - name: Content
    description: Peta belajar (Learning Path) dan Incremental Delta Sync
  - name: Units
    description: Soal latihan mikro dan penyelesaian unit
  - name: Tryouts
    description: Katalog Simulasi CAT BKN (Mandiri & Tryout Akbar Terjadwal)

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    ApiMeta:
      type: object
      properties:
        serverTimestamp:
          type: string
          format: date-time

    ApiErrorDetail:
      type: object
      required: [field, issue]
      properties:
        field:
          type: string
        issue:
          type: string

    ApiError:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: array
          items:
            $ref: "#/components/schemas/ApiErrorDetail"

    ErrorResponse:
      type: object
      required: [success, error]
      properties:
        success:
          type: boolean
          enum: [false]
        error:
          $ref: "#/components/schemas/ApiError"

    WelcomeBonus:
      type: object
      required: [xp, gems]
      properties:
        xp:
          type: integer
          example: 50
        gems:
          type: integer
          example: 10

    UserProfile:
      type: object
      required:
        - id
        - role
        - isGuest
        - dailyGoal
        - dailyXpTarget
        - dailyReminderEnabled
        - dailyReminderTime
        - onboardingCompleted
        - isPro
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
          nullable: true
        googleId:
          type: string
          nullable: true
        displayName:
          type: string
          nullable: true
        avatarUrl:
          type: string
          format: uri
          nullable: true
        role:
          type: string
          enum: [USER, ADMIN]
        isGuest:
          type: boolean
        targetInstitution:
          type: string
          nullable: true
        targetPosition:
          type: string
          nullable: true
        dailyGoal:
          type: string
          enum: [SANTAI, REGULER, AMBISIUS]
        dailyXpTarget:
          type: integer
          example: 50
        dailyReminderEnabled:
          type: boolean
        dailyReminderTime:
          type: string
          example: "19:30"
        onboardingCompleted:
          type: boolean
        isPro:
          type: boolean
        createdAt:
          type: string
          format: date-time

    GamificationSummary:
      type: object
      required:
        - totalXp
        - weeklyXp
        - gems
        - currentStreak
        - longestStreak
        - streakFreezes
        - hearts
        - leagueTier
      properties:
        totalXp:
          type: integer
        weeklyXp:
          type: integer
        gems:
          type: integer
        currentStreak:
          type: integer
        longestStreak:
          type: integer
        streakFreezes:
          type: integer
        hearts:
          type: integer
        lastHeartRegenAt:
          type: string
          format: date-time
          nullable: true
        lastActiveDate:
          type: string
          nullable: true
        leagueTier:
          type: string
          enum: [BRONZE, SILVER, GOLD, SAPPHIRE, DIAMOND]

    AuthData:
      type: object
      required:
        - accessToken
        - refreshToken
        - expiresIn
        - isNewUser
        - user
        - gamification
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        expiresIn:
          type: integer
          example: 900
        isNewUser:
          type: boolean
        welcomeBonus:
          $ref: "#/components/schemas/WelcomeBonus"
          nullable: true
        user:
          $ref: "#/components/schemas/UserProfile"
        gamification:
          $ref: "#/components/schemas/GamificationSummary"

    AuthResponse:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
          enum: [true]
        data:
          $ref: "#/components/schemas/AuthData"
        meta:
          $ref: "#/components/schemas/ApiMeta"

    GoogleLoginRequest:
      type: object
      required: [idToken]
      properties:
        idToken:
          type: string
        fcmToken:
          type: string

    GuestLoginRequest:
      type: object
      properties:
        fcmToken:
          type: string

    LinkGoogleRequest:
      type: object
      required: [idToken]
      properties:
        idToken:
          type: string

    RefreshTokenRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken:
          type: string

    OnboardingRequest:
      type: object
      properties:
        targetInstitution:
          type: string
          minLength: 1
          maxLength: 120
        targetPosition:
          type: string
          minLength: 1
          maxLength: 120
        dailyGoal:
          type: string
          enum: [SANTAI, REGULER, AMBISIUS]
        dailyReminderEnabled:
          type: boolean
        dailyReminderTime:
          type: string
          pattern: '^\d{2}:\d{2}$'
        diagnosticCompleted:
          type: boolean
        diagnosticScore:
          type: object
          properties:
            twkCorrect:
              type: boolean
            tiuCorrect:
              type: boolean
            tkpScore:
              type: integer
              minimum: 0
              maximum: 5

    CompleteUnitRequest:
      type: object
      required: [answers, durationSeconds, completedAt]
      properties:
        answers:
          type: array
          minItems: 1
          items:
            type: object
            required: [questionId, selectedOptionId]
            properties:
              questionId:
                type: string
                format: uuid
              selectedOptionId:
                type: string
                format: uuid
        heartsLost:
          type: integer
          minimum: 0
          maximum: 5
          default: 0
        durationSeconds:
          type: integer
          minimum: 1
        completedAt:
          type: string
          format: date-time

paths:
  /health:
    get:
      tags: [Health]
      summary: Cek kesehatan layanan (Database & Redis)
      responses:
        "200":
          description: Status kesehatan layanan
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      status:
                        type: string
                        enum: [healthy, degraded]
                      services:
                        type: object
                        properties:
                          database:
                            type: string
                            enum: [ok, down]
                          redis:
                            type: string
                            enum: [ok, down]

  /auth/google:
    post:
      tags: [Auth]
      summary: Login atau registrasi dengan Google ID Token
      description: Mengautentikasi pengguna via Google Sign-In. Pengguna baru otomatis menerima `welcomeBonus` (`+50 XP` dan `+10 Permata`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GoogleLoginRequest"
      responses:
        "200":
          description: Autentikasi Google berhasil
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          description: Validasi input gagal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Token Google tidak valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/guest:
    post:
      tags: [Auth]
      summary: Masuk sebagai akun tamu (Guest Mode)
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GuestLoginRequest"
      responses:
        "200":
          description: Sesi tamu berhasil dibuat
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"

  /auth/link-google:
    post:
      tags: [Auth]
      summary: Tautkan akun tamu ke Google Account
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LinkGoogleRequest"
      responses:
        "200":
          description: Akun berhasil ditautkan tanpa kehilangan progres
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Tidak terautentikasi atau token Google tidak valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Akun Google sudah terhubung dengan pengguna lain
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/refresh:
    post:
      tags: [Auth]
      summary: Rotasi refresh token untuk mendapatkan access token baru
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshTokenRequest"
      responses:
        "200":
          description: Token berhasil diperbarui
        "401":
          description: Refresh token tidak valid atau kedaluwarsa
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/logout:
    post:
      tags: [Auth]
      summary: Logout dan cabut refresh token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshTokenRequest"
      responses:
        "200":
          description: Berhasil logout

  /users/me:
    get:
      tags: [Users]
      summary: Ambil profil pengguna aktif & ringkasan gamifikasi
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Profil pengguna berhasil diambil
        "401":
          description: Token autentikasi tidak valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /users/me/onboarding:
    patch:
      tags: [Users]
      summary: Perbarui preferensi onboarding & target formasi CPNS
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OnboardingRequest"
      responses:
        "200":
          description: Onboarding atau preferensi profil berhasil diperbarui
        "400":
          description: Validasi input gagal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /onboarding/formations:
    get:
      tags: [Onboarding]
      summary: Ambil daftar formasi CPNS untuk Onboarding Langkah 1
      security:
        - bearerAuth: []
      parameters:
        - name: category
          in: query
          required: false
          schema:
            type: string
            enum: [KEMENTERIAN, LEMBAGA, PEMDA, HUKUM]
        - name: q
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Daftar formasi CPNS beserta passing grade dan rasio keketatan
        "400":
          description: Parameter category tidak valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /onboarding/diagnostic-questions:
    get:
      tags: [Onboarding]
      summary: Ambil 3 soal Diagnostic Baseline Quiz (TWK, TIU, TKP) untuk Onboarding Langkah 3
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Daftar 3 soal diagnostik awal

  /learning-path:
    get:
      tags: [Content]
      summary: Ambil peta belajar berkelok (S-Curve Path), jumlah Bank Kesalahan aktif, dan progres unit
      security:
        - bearerAuth: []
      parameters:
        - name: category
          in: query
          required: false
          schema:
            type: string
            enum: [TWK, TIU, TKP]
      responses:
        "200":
          description: Learning path berhasil diambil (berisi `pendingMistakesCount`, `gamification`, dan `categories`)
        "400":
          description: Parameter category tidak valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /content/sync:
    get:
      tags: [Content]
      summary: Incremental Delta Sync konten unit & soal
      security:
        - bearerAuth: []
      parameters:
        - name: since
          in: query
          required: false
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: Delta konten berhasil disinkronkan
        "400":
          description: Format timestamp since tidak valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /units/{unitId}/questions:
    get:
      tags: [Units]
      summary: Ambil daftar soal dan opsi jawaban untuk satu unit
      security:
        - bearerAuth: []
      parameters:
        - name: unitId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Daftar soal unit berhasil diambil
        "403":
          description: Unit terkunci atau membutuhkan langganan Nippia Pro
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Unit tidak ditemukan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /units/{unitId}/complete:
    post:
      tags: [Units]
      summary: Selesaikan unit latihan, klaim XP, dan buka unit berikutnya
      security:
        - bearerAuth: []
      parameters:
        - name: unitId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompleteUnitRequest"
      responses:
        "200":
          description: Unit selesai dan XP tercatat
        "400":
          description: Header Idempotency-Key tidak ada atau input tidak valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /tryouts:
    get:
      tags: [Tryouts]
      summary: Ambil daftar paket Simulasi CAT (Mini CAT / Full CAT) dan event Tryout Akbar terjadwal
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Katalog paket tryout dan jadwal Tryout Akbar berhasil diambil
        "401":
          description: Token autentikasi tidak valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
